$kind: http-request
description: |-
  Authenticates an existing user and returns a JWT token.

  **Authentication:** Requires a valid `X-API-Key` header.

  **Request body:**

  | Field | Type | Required | Description |
  |-------|------|----------|-------------|
  | `username` | string | ✅ | The user's registered username |
  | `password` | string | ✅ | The user's password |

  **Success response (200 OK):**

  ```json
  {
    "id": 123,
    "username": "johndoe",
    "token": "<JWT token valid for 1 hour>"
  }
  ```

  **Error responses:**

  | Status | Description |
  |--------|-------------|
  | `401 Unauthorized` | Missing/invalid API key, or incorrect username/password |
  | `500 Internal Server Error` | Unexpected server error |
url: "{{baseUrl}}/v1/users/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "username": "string",
      "password": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "username": {
          "type": "string"
        },
        "password": {
          "type": "string"
        }
      }
    }
settings: {}
examples: ./.resources/Log in a user.resources/examples
order: 1000
