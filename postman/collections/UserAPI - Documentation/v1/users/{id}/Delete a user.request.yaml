$kind: http-request
description: |-
  Permanently deletes a user account by their numeric ID.

  **Authentication:** Requires a valid `X-API-Key` header.

  **Path parameter:**

  | Parameter | Type | Required | Description |
  |-----------|------|----------|-------------|
  | `id` | integer | ✅ | The unique numeric ID of the user to delete |

  **Success response (200 OK):**

  ```json
  {
    "message": "User deleted successfully"
  }
  ```

  > ⚠️ **Warning:** This action is irreversible. The user record will be permanently removed from the database.

  **Error responses:**

  | Status | Description |
  |--------|-------------|
  | `401 Unauthorized` | Missing or invalid API key |
  | `500 Internal Server Error` | Unexpected server error |
url: '{{baseUrl}}/v1/users/:id'
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "5950"
    disabled: false
    description: 'The unique numeric ID of the user to delete. Example: 5950'
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
settings: {}
examples: ./.resources/Delete a user.resources/examples
order: 3000
